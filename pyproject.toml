[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tsip"
version = "0.2.7"
description = "Time–Space Intelligence Platform: evidence-graded statistics on how markets move through time and price levels."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Carlos Saritama" }]
keywords = ["quantitative-finance", "market-statistics", "event-study", "bootstrap", "bitcoin", "sp500"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Intended Audience :: Financial and Insurance Industry",
  "Intended Audience :: Science/Research",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = ["pandas>=2.1,<3", "numpy>=1.26,<3"]

[project.optional-dependencies]
calendar = ["exchange_calendars>=4.5"]
dev = ["pytest>=8", "ruff==0.17.2", "exchange_calendars>=4.5"]

[project.urls]
Homepage = "https://cssaritama.github.io/tsip-core/"
Source = "https://github.com/cssaritama/tsip-core"

[project.scripts]
tsip = "tsip.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::FutureWarning", "ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["src/tsip/research", "tests/research"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E741", "E501"]  # line length is handled by the formatter
