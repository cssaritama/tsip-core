name: Daily review

# Read-only review that runs every day without any person or tool: tests, lint, repository rules
# (tools/check_rules.py) and the freshness of the published report. A failure appears in the
# Actions tab and in GitHub's notification e-mail to the owner. Procedure and how to read it:
# CONTRIBUTING.md, section "Rules and daily review".

on:
  schedule:
    - cron: "43 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests tools
      - name: Test
        run: pytest
      - name: Repository rules and published report
        run: >-
          python tools/check_rules.py
          --since "$(date -u -d '2 days ago' +%Y-%m-%d)"
          --report-url https://cssaritama.github.io/tsip-core/data/report.json
