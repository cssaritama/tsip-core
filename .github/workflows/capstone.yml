name: Course project

# The course project's full flow on fresh data, on a schedule and on demand: download, features,
# models and simulations on the validation period, then the latest predictions and the orders the
# paper-trading example would place (dry run). It also builds the container and checks that it runs.
# Only statistics and orders are written to the summary and the artifact, never provider prices
# (data policy). The test period is never re-read here: it is a single logged run.

on:
  schedule:
    - cron: "17 23 * * 0"  # Sundays, after the weekly close of the funds
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: capstone
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TSIP_CAPSTONE_DATA: ${{ github.workspace }}/.capstone-data
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[calendar,capstone]"
      - name: Run the flow on fresh data
        run: python -m tsip.capstone.run_all --mode download | tee run.log
      - name: Latest predictions and orders (dry run)
        run: python -m tsip.capstone.paper_order --notional 1000 | tee orders.log
      - name: Summary
        run: |
          {
            echo "## Course project, scheduled run"
            echo
            echo "### Models and strategies (validation period)"
            echo '```'
            grep -E "^  h(5|20) |carried to the test period|^done in" run.log || true
            echo '```'
            echo "### Latest predictions and paper-trading orders (dry run; educational, not a signal)"
            echo '```json'
            sed '$d' orders.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          sed '$d' orders.log > latest_orders.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: latest-orders
          path: latest_orders.json
          retention-days: 30

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the container
        run: docker build -t tsip-capstone .
      - name: Check that it runs
        run: |
          docker run --rm tsip-capstone --help
          docker run --rm --entrypoint python tsip-capstone -c "import sklearn, xgboost, yfinance; import tsip.capstone.run_all, tsip.capstone.paper_order; print('container ok')"
