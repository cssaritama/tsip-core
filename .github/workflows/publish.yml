name: Publish report

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 6 * * *"  # daily, after the Asian session (GitHub may start scheduled runs hours late)
    - cron: "47 22 * * 1-5"  # weekdays, after the US close, so the evening report includes the day
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      freshness: ${{ steps.freshness.outcome }}
    env:
      ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
      ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
      # Cloudflare Pages is used when its token and project name are configured; GitHub Pages always runs.
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && vars.CLOUDFLARE_PROJECT != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[calendar]"

      - name: Restore market data cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data
          key: market-data-${{ github.run_id }}
          restore-keys: market-data-

      - name: Bitcoin · Coinbase hourly
        continue-on-error: true
        run: tsip fetch btc --source coinbase --start 2016-01-01
      - name: Bitcoin · Binance archive (independent cross-check)
        continue-on-error: true
        run: tsip fetch btc --source binance --start 2018-01-01
      - name: S&P 500 · SPY 30-minute (Alpaca)
        if: env.ALPACA_API_KEY_ID != ''
        continue-on-error: true
        run: tsip fetch sp500 --source alpaca --start 2016-01-01
      - name: Nasdaq-100 · QQQ 30-minute (Alpaca)
        if: env.ALPACA_API_KEY_ID != ''
        continue-on-error: true
        run: tsip fetch nasdaq100 --source alpaca --start 2016-01-01
      - name: S&P 500 · index daily, long history (Stooq; FRED close as fallback)
        continue-on-error: true
        run: tsip fetch sp500 --source stooq --start 1950-01-01 || tsip fetch sp500 --source fred --start 2016-01-01
      - name: Nasdaq-100 · index daily, long history (Stooq; FRED close as fallback)
        continue-on-error: true
        run: tsip fetch nasdaq100 --source stooq --start 1985-01-01 || tsip fetch nasdaq100 --source fred --start 1986-01-01

      - name: Build report
        run: tsip report --out site/data/report.json
      - name: Data status (every market present and up to date)
        id: freshness
        # Publication goes ahead either way; the status job below turns the run red when data is stale or missing.
        continue-on-error: true
        run: |
          set +e
          tsip check --report site/data/report.json --summary "$GITHUB_STEP_SUMMARY" > status.json
          code=$?
          python -c "import json; s=json.load(open('status.json')); [print(f\"::warning::{r['code']}: {r['reason']}\") for r in s['instruments'] if r['status']=='degraded']"
          exit $code
      - name: Build site
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: tsip site --report site/data/report.json --out dist --site-url "$SITE_URL"
      - name: Deploy to Cloudflare Pages
        if: env.HAS_CLOUDFLARE == 'true'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CLOUDFLARE_PROJECT }}
        run: |
          npx --yes wrangler@4.149.0 pages project create "$PROJECT" --production-branch main || true
          npx --yes wrangler@4.149.0 pages deploy dist --project-name "$PROJECT" --branch main --commit-dirty=true
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  status:
    # A green run must mean fresh data: this job fails when a market is stale or missing, so GitHub notifies the owner.
    needs: [build, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail when data is stale or missing
        run: |
          echo "build=${{ needs.build.result }} deploy=${{ needs.deploy.result }} freshness=${{ needs.build.outputs.freshness }}"
          test "${{ needs.build.result }}" = "success"
          test "${{ needs.deploy.result }}" = "success"
          test "${{ needs.build.outputs.freshness }}" = "success"
