name: Publish report

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 6 * * *"  # daily, after the Asian session (GitHub may start scheduled runs hours late)
    - cron: "47 22 * * 1-5"  # weekdays, after the US close, so the evening report includes the day
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      freshness: ${{ steps.freshness.outcome }}
    env:
      ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
      ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
      # Cloudflare Pages is used when its token and project name are configured; GitHub Pages always runs.
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && vars.CLOUDFLARE_PROJECT != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[calendar]"

      - name: Restore market data cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data
          key: market-data-${{ github.run_id }}
          restore-keys: market-data-

      - name: Bitcoin · Coinbase hourly
        continue-on-error: true
        run: tsip fetch btc --source coinbase --start 2016-01-01
      - name: Bitcoin · Binance archive (independent cross-check)
        continue-on-error: true
        run: tsip fetch btc --source binance --start 2018-01-01
      - name: Ether · Coinbase hourly
        continue-on-error: true
        run: tsip fetch eth --start 2016-06-01
      - name: S&P 500 · SPY 30-minute (Alpaca)
        if: env.ALPACA_API_KEY_ID != ''
        continue-on-error: true
        run: tsip fetch sp500 --source alpaca --start 2016-01-01
      - name: Nasdaq-100 · QQQ 30-minute (Alpaca)
        if: env.ALPACA_API_KEY_ID != ''
        continue-on-error: true
        run: tsip fetch nasdaq100 --source alpaca --start 2016-01-01
      - name: S&P 500 · index daily, long history (Stooq; FRED close as fallback)
        continue-on-error: true
        run: tsip fetch sp500 --source stooq --start 1950-01-01 || tsip fetch sp500 --source fred --start 2016-01-01
      - name: Nasdaq-100 · index daily, long history (Stooq; FRED close as fallback)
        continue-on-error: true
        run: tsip fetch nasdaq100 --source stooq --start 1985-01-01 || tsip fetch nasdaq100 --source fred --start 1986-01-01

      - name: Build report
        run: tsip report --out site/data/report.json
      - name: Keep the report for the point-in-time archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: report
          path: site/data/report.json
          retention-days: 7
      - name: Repository activity (scheduled runs stop after 60 days without it)
        run: |
          days=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "Last commit on main: $days days ago" >> "$GITHUB_STEP_SUMMARY"
          if [ "$days" -ge 45 ]; then
            echo "::warning::No commit on main for $days days. GitHub disables scheduled workflows in public repositories after 60 days without activity: publish any change, or re-enable the workflow from the Actions tab."
          fi
      - name: Data status (every market present and up to date)
        id: freshness
        # Publication goes ahead either way; the status job below turns the run red when data is stale or missing.
        continue-on-error: true
        run: |
          set +e
          tsip check --report site/data/report.json --summary "$GITHUB_STEP_SUMMARY" > status.json
          code=$?
          python -c "import json; s=json.load(open('status.json')); [print(f\"::warning::{r['code']}: {r['reason']}\") for r in s['instruments'] if r['status']=='degraded']"
          exit $code
      - name: Build site
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: tsip site --report site/data/report.json --out dist --site-url "$SITE_URL"
      - name: Deploy to Cloudflare Pages
        if: env.HAS_CLOUDFLARE == 'true'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CLOUDFLARE_PROJECT }}
        run: |
          npx --yes wrangler@4.149.0 pages project create "$PROJECT" --production-branch main || true
          npx --yes wrangler@4.149.0 pages deploy dist --project-name "$PROJECT" --branch main --commit-dirty=true
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      deployments: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Clear a stuck Pages deployment
        # A Pages deployment that never finishes blocks every later one with "in progress deployment"
        # (runs #27 and #28 on 2026-11-04). Cancel any earlier deployment that GitHub Pages still reports
        # as unfinished. This step never blocks the deployment below.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT: ${{ github.sha }}
        run: |
          for sha in $(gh api "repos/$REPO/deployments?environment=github-pages&per_page=10" --jq '.[].sha' | sort -u); do
            [ "$sha" = "$CURRENT" ] && continue
            status=$(gh api "repos/$REPO/pages/deployments/$sha" --jq '.status' 2>/dev/null || true)
            case "$status" in
              ""|succeed|deployment_failed|deployment_cancelled|deployment_content_failed|deployment_attempt_error|deployment_lost) ;;
              *) echo "Cancelling unfinished Pages deployment $sha ($status)"
                 gh api -X POST "repos/$REPO/pages/deployments/$sha/cancel" && sleep 10 ;;
            esac
          done
      - id: first
        # The action's maximum wait is 10 minutes (600000 ms); a larger value is cut to it (run #35 on
        # 2026-11-05 warned and timed out). When GitHub Pages is slow, one more attempt follows.
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          timeout: 600000
      - name: Cancel the unfinished attempt before retrying
        if: steps.first.outcome == 'failure'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT: ${{ github.sha }}
        run: |
          status=$(gh api "repos/$REPO/pages/deployments/$CURRENT" --jq '.status' 2>/dev/null || true)
          echo "First attempt status: ${status:-unknown}"
          gh api -X POST "repos/$REPO/pages/deployments/$CURRENT/cancel" || true
          sleep 30
      - id: second
        if: steps.first.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          timeout: 600000
      - id: deployment
        name: Published address
        run: echo "page_url=${{ steps.second.outputs.page_url || steps.first.outputs.page_url }}" >> "$GITHUB_OUTPUT"

  archive:
    # Every published report is stored once, compressed and fingerprinted, on the report-archive branch,
    # so what TSIP said on any past date can be reconstructed and checked (point-in-time record).
    needs: [build, deploy]
    if: needs.build.result == 'success' && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e .
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: report
          path: incoming
      - name: Add the report to the archive branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$remote" report-archive > /dev/null 2>&1; then
            git clone --quiet --depth 1 --branch report-archive "$remote" archive
          else
            git init --quiet archive
            git -C archive checkout --quiet --orphan report-archive
            git -C archive remote add origin "$remote"
            printf '%s\n' "# Report archive" "" "Every report published by TSIP, compressed and fingerprinted. \`index.csv\` lists them; \`tsip archive --dir <this folder> --verify-only\` re-checks every fingerprint." > archive/README.md
          fi
          tsip archive --report incoming/report.json --dir archive
          cd archive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Report already archived"; exit 0; fi
          git commit --quiet -m "archive: report $(python -c "import json; print(json.load(open('../incoming/report.json'))['generated_at'])")"
          git push --quiet origin report-archive

  status:
    # A green run must mean fresh data: this job fails when a market is stale or missing, so GitHub notifies the owner.
    needs: [build, deploy, archive]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail when data is stale or missing
        run: |
          echo "build=${{ needs.build.result }} deploy=${{ needs.deploy.result }} archive=${{ needs.archive.result }} freshness=${{ needs.build.outputs.freshness }}"
          test "${{ needs.build.result }}" = "success"
          test "${{ needs.deploy.result }}" = "success"
          test "${{ needs.archive.result }}" = "success"
          test "${{ needs.build.outputs.freshness }}" = "success"
